- name: Web server with nginx
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Write the web page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <h1>PXL web server</h1>
          <p>Image version {{ app_version }}</p>
        mode: "0644"

    - name: Start nginx at every boot
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
