name: Set up Terraform and Terragrunt
description: Installs fixed versions of Terraform and Terragrunt on the runner

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.17.0
        terraform_wrapper: false

    - name: Install Terragrunt
      shell: bash
      env:
        TG_VERSION: 1.2.1
      run: |
        mkdir -p "$RUNNER_TEMP/terragrunt"
        cd "$RUNNER_TEMP/terragrunt"
        url="https://github.com/gruntwork-io/terragrunt/releases/download/v$TG_VERSION"
        curl -sSLO "$url/terragrunt_linux_amd64"
        curl -sSLO "$url/SHA256SUMS"
        grep ' terragrunt_linux_amd64$' SHA256SUMS | sha256sum -c -
        mv terragrunt_linux_amd64 terragrunt
        chmod +x terragrunt
        echo "$RUNNER_TEMP/terragrunt" >> "$GITHUB_PATH"
