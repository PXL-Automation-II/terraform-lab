name: Deploy prod

# Only runs when someone starts it from the Actions tab
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apply:
    # Only deploy what is on main, never a feature branch
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lab]
    env:
      TG_TF_PATH: terraform
      TG_NON_INTERACTIVE: "true"
      TG_NO_COLOR: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terragrunt

      - name: Apply every prod unit
        working-directory: live/prod
        run: terragrunt run --all apply
