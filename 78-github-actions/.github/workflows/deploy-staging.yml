name: Deploy staging

on:
  push:
    branches: [main]
    paths: ["live/root.hcl", "live/staging/**"]

permissions:
  contents: read

# Never run two deployments of staging at the same time
concurrency:
  group: deploy-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apply:
    runs-on: [self-hosted, lab]
    env:
      TG_TF_PATH: terraform
      TG_NON_INTERACTIVE: "true"
      TG_NO_COLOR: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terragrunt

      - name: Apply every staging unit
        working-directory: live/staging
        run: terragrunt run --all apply
