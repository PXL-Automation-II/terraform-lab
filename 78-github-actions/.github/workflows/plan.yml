name: Plan

on:
  pull_request:
    paths: ["live/**"]

permissions:
  contents: read

defaults:
  run:
    shell: bash # stops a step when any command in a pipe fails

jobs:
  plan:
    runs-on: [self-hosted, lab]
    env:
      TG_TF_PATH: terraform
      TG_NON_INTERACTIVE: "true"
      TG_NO_COLOR: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-terragrunt

      - name: Plan every unit
        working-directory: live
        run: terragrunt run --all plan 2>&1 | tee plan.txt

      - name: Write the plan summary
        if: always()
        working-directory: live
        run: |
          echo "## Plan per unit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Plan:|No changes' plan.txt | sed -E 's/^.*\[(.*)\] terraform: /\1: /' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
